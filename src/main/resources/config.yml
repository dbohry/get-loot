# GetLoot configuration
#
# tiers:   named item pools. A drop rolls against the tier's threshold (see "mobs").
# mobs:    loot per entity type. The key is the EntityType name (case-insensitive);
#          use "entities: [...]" to cover several types with one entry.
# drops:   each entry is { tier: NAME } or { items: [MATERIAL, ...] } plus optional
#            tries:       how many times to roll (default 1). Each roll can succeed;
#                         at most ONE item is dropped per entry.
#            multiplier:  scales the chance per roll (default 1.0)
#            threshold:   only for "items" entries, same meaning as in tiers (default 900)
#            enchantments: [fire_aspect, sharpness]  one is applied at random, level 1
#
# Chance per roll = 1 - threshold / (1000 * multiplier), clamped to 0..1.
# A threshold of 900 is therefore 10% per roll, 990 is 1%, 1000 never drops
# unless the multiplier is above 1.
#
# Unknown materials or entity types are skipped with a warning in the server log.

tiers:
  COMMON_CURRENCY:
    threshold: 500
    items: [IRON_NUGGET, GOLD_NUGGET]
  RARE_CURRENCY:
    threshold: 990
    items: [EMERALD, LAPIS_LAZULI]
  VERY_COMMON:
    threshold: 900
    items: [LEATHER_HELMET, LEATHER_CHESTPLATE, LEATHER_LEGGINGS, LEATHER_BOOTS, WOODEN_SHOVEL, WOODEN_PICKAXE, WOODEN_AXE, WOODEN_SWORD, WOODEN_HOE, PUMPKIN_SEEDS, MELON_SEEDS, WHEAT_SEEDS, LEATHER, OAK_SAPLING, POTATO, CARROT]
  COMMON:
    threshold: 950
    items: [CHAINMAIL_HELMET, CHAINMAIL_CHESTPLATE, CHAINMAIL_LEGGINGS, CHAINMAIL_BOOTS, STONE_SHOVEL, STONE_PICKAXE, STONE_AXE, STONE_SWORD, STONE_HOE, BEEF, COOKED_BEEF, BREAD, IRON_INGOT, IRON_NUGGET, ARROW, PAPER]
  RARE:
    threshold: 990
    items: [IRON_HELMET, IRON_CHESTPLATE, IRON_LEGGINGS, IRON_BOOTS, IRON_SHOVEL, IRON_PICKAXE, IRON_AXE, IRON_SWORD, IRON_HOE, GOLD_NUGGET, GOLDEN_SHOVEL, GOLD_INGOT, DIAMOND, CROSSBOW, SADDLE, NAME_TAG, FISHING_ROD, IRON_HORSE_ARMOR]
  VERY_RARE:
    threshold: 999
    items: [EMERALD, GOLDEN_HELMET, GOLDEN_CHESTPLATE, GOLDEN_LEGGINGS, GOLDEN_BOOTS, GOLDEN_PICKAXE, GOLDEN_AXE, GOLDEN_SWORD, GOLDEN_HOE, DIAMOND_HELMET, DIAMOND_CHESTPLATE, DIAMOND_LEGGINGS, DIAMOND_BOOTS, DIAMOND_SHOVEL, DIAMOND_PICKAXE, DIAMOND_AXE, DIAMOND_SWORD, DIAMOND_HOE, SHIELD, MAP, COMPASS, CLOCK, NETHERITE_INGOT, GOLDEN_APPLE, HORSE_SPAWN_EGG, DIAMOND_HORSE_ARMOR]
  EPIC:
    threshold: 1000
    items: [NETHERITE_HELMET, NETHERITE_CHESTPLATE, NETHERITE_LEGGINGS, NETHERITE_BOOTS, NETHERITE_SHOVEL, NETHERITE_PICKAXE, NETHERITE_AXE, NETHERITE_SWORD, NETHERITE_HOE, TOTEM_OF_UNDYING, ELYTRA, NETHER_WART]

# Rolled once for every kill that already dropped something.
bonus-drops:
  - { tier: COMMON_CURRENCY, tries: 2 }
  - { tier: RARE_CURRENCY, tries: 2 }

# Place a chest on a redstone block, put the listed items in it and close it:
# the items are consumed and the player receives one item from the tier.
exchange:
  max-stacks: 3
  recipes:
    - { inputs: [EMERALD, LAPIS_LAZULI, GOLD_INGOT], tier: EPIC }
    - { inputs: [EMERALD, LAPIS_LAZULI], tier: VERY_RARE }
    - { inputs: [GOLD_INGOT, IRON_INGOT], tier: RARE }
    - { inputs: [GOLD_NUGGET, IRON_NUGGET], tier: COMMON }

